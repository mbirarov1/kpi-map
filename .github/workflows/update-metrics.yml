# .github/workflows/update-metrics.yml
# PMO из Kaiten — каждые 30 минут (лёгкий, 2 запроса).
# CPO и CTO из Kaiten — тоже каждые 30 минут (роадмап, пространство CTO, Platform, аналитика).
# HOPE из Huntflow — только в 06:00 и 15:00 UTC (09:00 и 18:00 МСК): скрипт тяжёлый, ~50 запросов.
# Ручной запуск (Run workflow) прогоняет ВСЁ, включая HOPE.
name: Update metrics

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate PMO metrics from Kaiten
        env:
          KAITEN_TOKEN: ${{ secrets.KAITEN_TOKEN }}
        run: python3 auto/update_pmo_metrics.py

      - name: Recalculate CPO and CTO metrics from Kaiten
        env:
          KAITEN_TOKEN: ${{ secrets.KAITEN_TOKEN }}
        run: python3 auto/update_cpo_cto_metrics.py

      # Таблица-источник / витрина (если включена)
      - name: Pull metrics from source sheet
        if: ${{ vars.SOURCE_ENABLED == 'true' }}
        env:
          SOURCE_SHEET_ID: ${{ secrets.SOURCE_SHEET_ID }}
          SOURCE_GID: ${{ secrets.SOURCE_GID }}
        run: python3 auto/update_source_sheet.py

      # HOPE: только утренний и вечерний прогон + любой ручной запуск
      - name: Pull HOPE metrics from Huntflow
        if: ${{ vars.HUNTFLOW_ENABLED == 'true' }}
        env:
          HUNTFLOW_TOKEN: ${{ secrets.HUNTFLOW_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$M" -lt 30 ] && { [ "$H" = "06" ] || [ "$H" = "15" ]; }; }; then
            python3 auto/update_hope_metrics.py
          else
            echo "HOPE пропущен: сейчас $H:$M UTC. Huntflow опрашиваем в 06:00 и 15:00 UTC (09:00 и 18:00 МСК) или вручную."
          fi

      - name: Commit data
        run: |
          git config user.name "metrics-bot"
          git config user.email "actions@users.noreply.github.com"
          # hope.json тоже коммитим — без него страница «Найм» пустая
          git add data/metrics.json
          [ -f data/hope.json ] && git add data/hope.json
          if git diff --cached --quiet; then
            echo "изменений нет"; exit 0
          fi
          git commit -m "metrics: $(date -u +%F\ %H:%M)"
          # робот и человек могут писать в репозиторий одновременно — пробуем несколько раз
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "запушено с попытки $i"; exit 0
            fi
            echo "попытка $i не прошла, ждём"; sleep 7
          done
          echo "не удалось запушить после 3 попыток"; exit 1
